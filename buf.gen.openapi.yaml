version: v2
inputs:
  - directory: proto

plugins:
  - remote: buf.build/community/sudorandom-connect-openapi:v0.28.0
    out: src-tauri/src/workspace/api/openapi
    opt:
      - features=connectrpc
      - format=json
      - path=local-api.openapi.json
      - allow-get
      - with-streaming
      - content-types=json
      - short-operation-ids
