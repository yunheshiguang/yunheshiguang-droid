[package]
name = "yunheshiguang"
description = "yunheshiguang desktop app"
authors = ["yunheshiguang"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yunheshiguang_lib"
crate-type = ["rlib"]

[features]
reference-extension = ["dep:tauri-plugin-reference-extension"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
yunheshiguang-contract.workspace = true
yunheshiguang-sdk.workspace = true
connectrpc.workspace = true
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
tauri-plugin-reference-extension = { workspace = true, optional = true }
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tempfile.workspace = true
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-log = "2.10.0"
which = "8.0.6"
reqwest = { version = "0.13.4", default-features = true, features = ["blocking"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
sha2.workspace = true
tar = "0.4.46"
base64.workspace = true
subtle.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tokio = { version = "1.53.1", features = ["macros", "net", "sync", "time"] }
croner = "4.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.26.1", features = ["v7"] }
getrandom = "0.4.3"
async-openai = { version = "0.42.0", default-features = false, features = ["chat-completion", "rustls"] }
futures-util = { version = "0.3", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
csv = "1.4.0"
whoami = "2.1.3"
semver = "1.0.28"
parking_lot = { version = "0.12.5", features = ["arc_lock", "send_guard"] }
sys-locale = "0.3.2"
minisign = "0.10.0"

[dev-dependencies]
connectrpc = { workspace = true, features = ["client"] }
tauri = { workspace = true, features = ["test"] }
wiremock = "0.6.5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
