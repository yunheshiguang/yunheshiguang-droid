[package]
name = "tauri-plugin-reference-extension"
description = "Reference commercial extension: team identity, Cedar policy, license entitlements, team audit, sync-folder storage, template market packages, a second AI provider and Redroid cloud phones"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "tauri-plugin-reference-extension"
build = "build.rs"

[dependencies]
yunheshiguang-sdk.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
prometheus-client = "0.25.1"
base64.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile.workspace = true
cedar-policy = "4.13.0"
bollard = "0.21.1"
genai = "0.6.5"
futures-util = { version = "0.3", default-features = false }
reqwest = "0.13.4"
whoami = "2.1.3"
uuid = { version = "1.26.1", features = ["v7"] }

[build-dependencies]
tauri-plugin = { version = "2.7.1", features = ["build"] }

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6.5"
