name: Installers

on:
  workflow_call:
    inputs:
      channel:
        description: The release channel the installers check for updates, nightly or release
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Installers (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x86-64
            runner: windows-2025
            os: windows
            arch: x86_64
            bundles: nsis
          - name: Linux x86-64
            runner: ubuntu-24.04
            os: linux
            arch: x86_64
            bundles: appimage,deb,rpm
          - name: macOS Apple silicon
            runner: macos-15
            os: macos
            arch: arm64
            bundles: dmg
          - name: macOS Intel
            runner: macos-15-intel
            os: macos
            arch: x86_64
            bundles: dmg
    env:
      YUNHESHIGUANG_BUILD_CHANNEL: ${{ inputs.channel }}
      YUNHESHIGUANG_BUILD_COMMIT: ${{ github.sha }}
      YUNHESHIGUANG_BUILD_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target
          key: installers
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: scripts/retry.sh 3 10 pnpm install --frozen-lockfile
        shell: bash

      - name: Build installers
        run: scripts/retry.sh 2 30 pnpm tauri build --ci --bundles ${{ matrix.bundles }}
        shell: bash

      - name: Name the installers
        run: node scripts/release/release.mjs collect target/release/bundle release-assets --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
