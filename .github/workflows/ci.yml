name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks and frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check distributions
        run: pnpm check:distributions

      - name: Verify protobuf contracts
        run: pnpm proto:verify

      - name: Check that published installer names stay available
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline="$BASELINE"
          if [ -z "$baseline" ]; then
            baseline=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          fi
          node scripts/release/release.mjs compat --baseline "$baseline"

      - name: Check protobuf compatibility with the base branch
        if: github.event_name == 'pull_request'
        run: pnpm exec buf breaking --against ".git#ref=${{ github.event.pull_request.base.sha }}"

      - name: Check protobuf compatibility with the latest release
        if: github.event_name != 'pull_request'
        run: |
          release=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$release" ]; then
            pnpm exec buf breaking --against ".git#tag=$release"
          fi

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: pnpm lint:rust

      - name: Lint the open-source app as it ships
        run: cargo clippy -p yunheshiguang --locked -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-deny@0.20.2

      - name: Check Rust dependencies
        run: pnpm lint:deps

  frontend-windows:
    name: Frontend checks (Windows x86-64)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks and frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust-tests:
    name: Rust tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-2025
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: macOS Apple silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Provide a frontend build for the Tauri context
        shell: bash
        run: mkdir -p dist && printf '<!doctype html>\n' > dist/index.html

      - name: Test Rust workspace
        run: cargo test --workspace --all-features --locked
